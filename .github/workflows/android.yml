name: Android build
on:
  push:
    branches: [main]
    paths: ['native/**', 'docs/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['native/**', 'docs/**', '.github/workflows/android.yml']
  workflow_dispatch:
defaults:
  run:
    working-directory: native
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: native/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: android-actions/setup-android@v3
        with:
          # Default package list still includes the removed "tools" package.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: npm ci
      - name: Copy PWA from docs/ and sync Capacitor
        run: WEB_SRC=../docs bash scripts/copy-web.sh && npx cap sync android
      - name: Set up release signing (only if secrets exist)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p keys && echo "$KS_B64" | base64 -d > keys/upload.jks
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$PWD/keys/upload.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keys/keystore.properties
            echo "SIGNED=1" >> $GITHUB_ENV
          fi
      - name: Build release APK
        working-directory: native/android
        # versionCode 4 / versionName 1.0.3 from app/build.gradle.
        # github.run_number on this repo is below the installed APK (versionCode 3).
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Build signed release AAB
        if: env.SIGNED == '1'
        working-directory: native/android
        run: ./gradlew bundleRelease --no-daemon
      - name: Upload unsigned release APK
        if: env.SIGNED != '1'
        uses: actions/upload-artifact@v4
        with:
          name: street-knowledge-release-unsigned
          path: native/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload signed release
        if: env.SIGNED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: street-knowledge-release-signed
          path: |
            native/android/app/build/outputs/apk/release/*.apk
            native/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - if: always()
        run: rm -rf keys
